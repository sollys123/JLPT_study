name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run deterministic tests
        run: |
          node tests/fsrs.test.js
          node tests/dictionary.test.js
          python tests/static_app_test.py

      - name: Fetch and verify JMdict packages
        run: python tools/fetch_jmdict.py both

      - name: Build clean Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll VERSION.json LICENSES.md _site/
          cp -R assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
